# Copy to inventory.ini (git-ignored) and fill in.
#
# No ansible_user/ansible_port needed: the playbook probes ssh_port (vars.yml)
# and falls back to root@22 on a fresh server by itself.
[ranch]
203.0.113.10 hostname=ranch-server-1 domain=example.com
# 203.0.113.11 hostname=ranch-server-2   # no domain => no Let's Encrypt, snakeoil HTTPS

[ranch:vars]
le_email=you@example.com
# Either the key itself...
ssh_pubkey="ssh-ed25519 AAAA... you@laptop"
# ...or a path on your laptop (absolute, no ~):
# ssh_pubkey_path=/Users/you/.ssh/id_ed25519.pub

# Apache/Let's Encrypt name defaults to <hostname>.<domain>. Override per host:
# 203.0.113.10 hostname=ranch-server-1 domain=example.com apache_server_name=example.com
