[defaults]
inventory = inventory.ini
interpreter_python = auto_silent

[ssh_connection]
# accept-new trusts a host key the first time it is seen (including on the new
# SSH port after the first run) but still refuses a key that has CHANGED.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
pipelining = True
