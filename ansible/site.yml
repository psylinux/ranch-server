---
# =========================
# 1) Bootstrap: pick how to connect, then ensure Python exists on the remote
# =========================
# A fresh server only answers root@22. After the first run sshd listens on
# ssh_port, and the playbook connects as primary_user from then on.
- name: Bootstrap
  hosts: ranch
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    # delegate_to: localhost makes ansible_host point at localhost, so the
    # server's address is read from hostvars.
    - name: Probe the SSH port from your laptop
      ansible.builtin.wait_for:
        host: "{{ hostvars[inventory_hostname]['ansible_host'] | default(inventory_hostname) }}"
        port: "{{ ssh_port }}"
        timeout: 5
      delegate_to: localhost
      become: false
      register: _ssh_port_probe
      failed_when: false
      tags: [always]

    - name: Pick the SSH connection (fresh server -> root@22, else primary user@ssh_port)
      ansible.builtin.set_fact:
        ansible_port: "{{ ssh_port if _ssh_port_probe.state | default('') == 'started' else 22 }}"
        ansible_user: "{{ primary_user if _ssh_port_probe.state | default('') == 'started' else 'root' }}"
        _fresh_server: "{{ _ssh_port_probe.state | default('') != 'started' }}"
      tags: [always]

    # Skips apt-get entirely once Python and python3-apt are there.
    - name: Install Python so Ansible can work
      ansible.builtin.raw: |
        command -v python3 >/dev/null 2>&1 && dpkg -s python3-apt >/dev/null 2>&1 && exit 0
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -y
        apt-get install -y python3 python3-apt sudo
      become: "{{ ansible_user != 'root' }}"
      changed_when: false
      tags: [always]

# =========================
# 2) Converge server to desired state
# =========================
- name: Converge server to desired state
  hosts: ranch
  become: true
  gather_facts: true
  vars_files:
    - vars.yml
  vars:
    docker_arch_map:
      x86_64: amd64
      aarch64: arm64
      armv7l: armhf
      armv6l: arm
  tasks:
    # ---------- FIREWALL: no host firewall; use the provider's (e.g. DigitalOcean Cloud Firewall) ----------
    - name: Check if ufw systemd unit exists
      ansible.builtin.stat:
        path: /lib/systemd/system/ufw.service
      register: ufw_unit
      tags: [firewall]

    - name: Check ufw status
      ansible.builtin.command: ufw status
      register: ufw_status
      changed_when: false
      failed_when: false
      when: ufw_unit.stat.exists
      tags: [firewall]

    - name: Disable ufw if active
      ansible.builtin.command: ufw disable
      changed_when: true
      when:
        - ufw_unit.stat.exists
        - "'status: active' in (ufw_status.stdout | default('') | lower)"
      tags: [firewall]

    - name: Stop/disable ufw service if present
      ansible.builtin.systemd:
        name: ufw
        state: stopped
        enabled: false
        masked: true
      when: ufw_unit.stat.exists
      tags: [firewall]

    - name: Check whether Docker is already installed
      ansible.builtin.stat:
        path: /usr/bin/dockerd
      register: dockerd_bin
      tags: [firewall]

    # First run only: once Docker (and fail2ban) are installed, flushing would
    # wipe their chains and break container networking until a restart.
    - name: Flush iptables/ip6tables and set ACCEPT policies (first run only)
      ansible.builtin.shell: |
        set -e
        command -v iptables >/dev/null 2>&1 || exit 0
        for tbl in filter nat mangle raw; do
          iptables -t "$tbl" -F || true
          iptables -t "$tbl" -X || true
          ip6tables -t "$tbl" -F || true
          ip6tables -t "$tbl" -X || true
        done
        iptables -P INPUT ACCEPT
        iptables -P FORWARD ACCEPT
        iptables -P OUTPUT ACCEPT
        ip6tables -P INPUT ACCEPT
        ip6tables -P FORWARD ACCEPT
        ip6tables -P OUTPUT ACCEPT
      changed_when: true
      when: not dockerd_bin.stat.exists
      tags: [firewall]

    # ---------- HOSTNAME ----------
    - name: Derive host/domain values (inventory overrides vars.yml)
      ansible.builtin.set_fact:
        _hostname: "{{ hostvars[inventory_hostname].hostname | default(hostname, true) | default(ansible_facts.hostname, true) | default('') }}"
        _domain: "{{ hostvars[inventory_hostname].domain | default(domain, true) | default('') }}"
      tags: [always]

    - name: Compute FQDN when domain is provided
      ansible.builtin.set_fact:
        _fqdn: "{{ _hostname }}.{{ _domain }}"
      when:
        - _hostname | length > 0
        - _domain | length > 0
      tags: [always]

    - name: Set system hostname
      ansible.builtin.hostname:
        name: "{{ _fqdn | default(_hostname) }}"
      when:
        - _hostname | length > 0
      tags: [hostname]

    - name: Ensure /etc/hosts has 127.0.1.1 mapping for hostname
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE ranch-servers hostname"
        block: |
          127.0.1.1 {{ (_fqdn | default(_hostname)) | trim }} {{ _hostname }}
      when:
        - _hostname | length > 0
      tags: [hostname]

    - name: Check for cloud-init
      ansible.builtin.stat:
        path: /etc/cloud/cloud.cfg.d
      register: cloud_init_dir
      tags: [hostname]

    # Otherwise cloud-init may put the droplet name back on reboot.
    - name: Keep cloud-init from resetting the hostname and /etc/hosts
      ansible.builtin.copy:
        dest: /etc/cloud/cloud.cfg.d/99-ranch-server.cfg
        mode: "0644"
        content: |
          # Managed by Ansible (ranch-server): hostname and /etc/hosts are set by the playbook.
          preserve_hostname: true
          manage_etc_hosts: false
      when: cloud_init_dir.stat.exists
      tags: [hostname]

    # ---------- UPDATES ----------
    # Fresh server only (bootstrap fell back to root@22): a later run never
    # upgrades or reboots a server that may be serving the site or a C2 session.
    - name: Fresh server - full upgrade and optional reboot
      when:
        - first_run_upgrade | bool
        - _fresh_server | bool
      tags: [updates]
      block:
        - name: Upgrade all packages (apt dist-upgrade)
          ansible.builtin.apt:
            update_cache: true
            upgrade: dist

        - name: Check whether the upgrade needs a reboot
          ansible.builtin.stat:
            path: /var/run/reboot-required
          register: reboot_required

        - name: Reboot to finish the upgrade
          ansible.builtin.reboot:
            reboot_timeout: 600
          when:
            - first_run_reboot | bool
            - reboot_required.stat.exists

    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present
      when: unattended_upgrades | bool
      tags: [updates]

    - name: Enable daily security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
      when: unattended_upgrades | bool
      tags: [updates]

    # ---------- DOCKER APT REPO (so docker-compose-plugin is available) ----------
    - name: Install Docker repo prerequisites
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        state: present
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release

    - name: Compute Docker repo base (debian/ubuntu)
      ansible.builtin.set_fact:
        docker_repo_base: "{{ 'ubuntu' if ansible_facts.distribution == 'Ubuntu' else 'debian' }}"

    - name: Ensure keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker’s official GPG key
      ansible.builtin.shell: |
        set -euo pipefail
        curl -fsSL https://download.docker.com/linux/{{ docker_repo_base }}/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        executable: /bin/bash
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker APT repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.list
        mode: "0644"
        content: |
          deb [arch={{ docker_arch_map[ansible_facts.architecture] | default('amd64') }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/{{ docker_repo_base }} {{ ansible_facts.distribution_release }} stable
      register: docker_repo

    # Not a handler: docker-ce is installed a few tasks below, in this same play.
    - name: Update apt cache after adding Docker repo  # noqa: no-handler
      ansible.builtin.apt:
        update_cache: true
      when: docker_repo is changed

    # ---------- PACKAGES (Docker from official repo; optional stacks below) ----------
    - name: Install base packages
      ansible.builtin.apt:
        state: present
        name:
          - acl  # lets Ansible run tasks as an unprivileged user (become_user)
          - netcat-openbsd
          - tcpdump
          - openssh-server
          # Docker stack from official repo
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
          # Toolchain
          - build-essential
          - gcc
          - g++
          - git
          - curl
          - jq
          - unzip
          - make
      tags: [packages]

    - name: Wireshark / tshark
      when: install_wireshark | bool
      tags: [wireshark]
      block:
        # Non-root capture for members of the "wireshark" group only. The old
        # setcap on dumpcap let every local user (www-data included) capture.
        - name: Let members of the wireshark group capture packets
          ansible.builtin.debconf:
            name: wireshark-common
            question: wireshark-common/install-setuid
            value: "true"
            vtype: boolean
          notify: Reconfigure wireshark-common

        - name: Install Wireshark and tshark
          ansible.builtin.apt:
            state: present
            name:
              - wireshark
              - tshark

    - name: Install mingw-w64 (Windows cross-compiler)
      ansible.builtin.apt:
        name: mingw-w64
        state: present
      when: install_mingw | bool
      tags: [mingw]

    - name: Install WireGuard
      ansible.builtin.apt:
        state: present
        name:
          - wireguard
          - wireguard-tools
      when: install_wireguard | bool
      tags: [wireguard]

    # ---------- DOCKER DAEMON ----------
    - name: Configure the Docker daemon (log rotation, live-restore)
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: "{{ _docker_daemon | to_nice_json }}\n"
      vars:
        _docker_daemon: >-
          {{ {'log-driver': 'json-file',
              'log-opts': {'max-size': docker_log_max_size | string, 'max-file': docker_log_max_file | string},
              'live-restore': true}
             | combine({'ip': '127.0.0.1'} if docker_publish_localhost_only | bool else {}) }}
      notify: Restart Docker
      tags: [docker]

    - name: Enable & start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started
      tags: [docker, services]

    # ---------- GROUPS ----------
    - name: Ensure supplementary groups exist
      ansible.builtin.group:
        name: "{{ item }}"
        state: present
      loop: "{{ ['docker'] + (['wireshark'] if install_wireshark | bool else []) }}"
      tags: [users]

    # ---------- USER + KEY ----------
    - name: Create primary user
      ansible.builtin.user:
        name: "{{ primary_user }}"
        groups: "{{ ['sudo', 'docker'] + (['wireshark'] if install_wireshark | bool else []) }}"
        append: true
        shell: /bin/bash
        create_home: true
        # No password_lock: "false" means "unlock", which re-runs usermod -U on
        # this key-only (passwordless) account on every run.
      tags: [users]

    - name: Load SSH public key (direct string or from path)
      ansible.builtin.set_fact:
        _raw_ssh_pubkey: >-
          {% if ssh_pubkey_path is defined and ssh_pubkey_path | length > 0 %}
          {{ lookup('file', ssh_pubkey_path) }}
          {% else %}
          {{ ssh_pubkey | default('') }}
          {% endif %}
      tags: [users]

    - name: Validate provided SSH public key
      ansible.builtin.assert:
        that:
          - _raw_ssh_pubkey | trim | length > 0
        fail_msg: "ssh_pubkey is empty or not set; set ssh_pubkey or ssh_pubkey_path in inventory.ini, or pass -e ssh_pubkey_path=/path/to/key.pub"
      tags: [users]

    - name: Normalize SSH public key to first line
      ansible.builtin.set_fact:
        _ssh_pubkey_line: "{{ _raw_ssh_pubkey.splitlines()[0] | trim }}"
      tags: [users]

    - name: Validate SSH public key format (type + key at minimum)
      ansible.builtin.assert:
        that:
          - _ssh_pubkey_line.split() | length >= 2
        fail_msg: "ssh_pubkey looks malformed; starts with '{{ _ssh_pubkey_line | truncate(80, True, '...') }}'. Pass -e ssh_pubkey_path=/path/to/key.pub to avoid shell quoting issues."
      tags: [users]

    - name: Passwordless sudo for primary user
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/90-{{ primary_user }}"
        content: "{{ primary_user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
      tags: [users]

    - name: Add your SSH public key
      ansible.posix.authorized_key:
        user: "{{ primary_user }}"
        key: "{{ _ssh_pubkey_line }}"
      tags: [users]

    # ---------- SWAP (small droplets) ----------
    - name: Swap file
      when:
        - swap_file_size_mb | int > 0
        - ansible_facts.swaptotal_mb | default(0) | int == 0
      tags: [swap]
      block:
        - name: Allocate /swapfile
          ansible.builtin.command: fallocate -l {{ swap_file_size_mb | int }}M /swapfile
          args:
            creates: /swapfile

        - name: Restrict /swapfile permissions
          ansible.builtin.file:
            path: /swapfile
            mode: "0600"

        - name: Format and enable /swapfile
          ansible.builtin.shell: |
            set -e
            mkswap /swapfile
            swapon /swapfile
          changed_when: true

        - name: Enable /swapfile at boot
          ansible.builtin.lineinfile:
            path: /etc/fstab
            line: /swapfile none swap sw 0 0
            regexp: '^/swapfile\s'

        - name: Prefer RAM over swap
          ansible.posix.sysctl:
            name: vm.swappiness
            value: "10"
            sysctl_file: /etc/sysctl.d/99-ranch-server-swap.conf

    # ---------- PYENV + PINNED CPYTHON ----------
    - name: Pyenv
      when: install_pyenv | bool
      tags: [pyenv]
      block:
        - name: Install CPython build dependencies
          ansible.builtin.apt:
            state: present
            name:
              - libssl-dev
              - zlib1g-dev
              - libbz2-dev
              - libreadline-dev
              - libsqlite3-dev
              - llvm
              - libncurses-dev  # libncursesw5-dev no longer exists on Ubuntu 24.04
              - xz-utils
              - tk-dev
              - libxml2-dev
              - libxmlsec1-dev
              - libffi-dev
              - liblzma-dev

        - name: Install system-wide pyenv {{ pyenv_version }}
          ansible.builtin.git:
            repo: "https://github.com/pyenv/pyenv.git"
            dest: /usr/local/pyenv
            version: "{{ pyenv_version }}"

        - name: Profile for pyenv
          ansible.builtin.copy:
            dest: /etc/profile.d/pyenv.sh
            mode: "0644"
            content: |
              export PYENV_ROOT=/usr/local/pyenv
              export PATH="$PYENV_ROOT/bin:$PATH"
              # --no-rehash: shims are root-owned, users cannot rehash at login.
              eval "$(pyenv init - --no-rehash)"

        - name: Build and select with pyenv CPython {{ pyenv_python_version }}
          ansible.builtin.shell: |
            set -e
            mkdir -p /var/tmp/pyenv-build
            export TMPDIR=/var/tmp/pyenv-build
            export PYENV_ROOT=/usr/local/pyenv
            export PATH="$PYENV_ROOT/bin:$PATH"
            pyenv install -s "{{ pyenv_python_version }}"
            pyenv global "{{ pyenv_python_version }}"
            pyenv rehash
          args:
            creates: "/usr/local/pyenv/versions/{{ pyenv_python_version }}"

    # ---------- APACHE: HTTPS DEFAULT + LE (best-effort) ----------
    - name: Apache + Let's Encrypt
      when: install_apache | bool
      block:
        - name: Install Apache and certbot
          ansible.builtin.apt:
            state: present
            name:
              - apache2
              - certbot
              - python3-certbot-apache
          tags: [apache]

        # <hostname>.<domain> by default; apache_server_name (inventory) wins.
        - name: Compute the Apache ServerName
          ansible.builtin.set_fact:
            _vhost_name: >-
              {{ apache_server_name | default(_fqdn | default(_hostname or _domain or ansible_facts.hostname or inventory_hostname, true), true) }}
          tags: [apache, lets-encrypt]

        - name: Enable Apache modules
          ansible.builtin.command: a2enmod {{ item }}
          args:
            creates: "/etc/apache2/mods-enabled/{{ item }}.load"
          loop: [ssl, headers, rewrite]
          notify: Reload Apache
          tags: [apache]

        - name: Force HTTP -> HTTPS
          ansible.builtin.copy:
            dest: /etc/apache2/sites-available/000-default.conf
            mode: "0644"
            content: |
              <VirtualHost *:80>
                ServerName {{ _vhost_name }}
                RewriteEngine On
                RewriteCond %{HTTPS} !=on
                RewriteRule ^/(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
              </VirtualHost>
          notify: Reload Apache
          tags: [apache]

        - name: Ensure Apache enabled and started
          ansible.builtin.systemd:
            name: apache2
            enabled: true
            state: started
          tags: [apache, services]

        # certonly: certbot only obtains/renews the certificate and never edits
        # the vhosts managed here; the deploy hook reloads Apache on renewal.
        - name: Try Let’s Encrypt (needs a domain and DNS pointing here)
          ansible.builtin.command: >-
            certbot certonly --apache --non-interactive --agree-tos
            -m {{ le_email | quote }} -d {{ _vhost_name | quote }}
            --deploy-hook "systemctl reload apache2"
          args:
            creates: "/etc/letsencrypt/live/{{ _vhost_name }}/fullchain.pem"
          register: le_result
          failed_when: false
          changed_when: le_result.rc | default(1) == 0
          when: _domain | length > 0 or apache_server_name is defined
          tags: [apache, lets-encrypt]

        - name: Warn when Let's Encrypt failed
          ansible.builtin.debug:
            msg: >-
              Let's Encrypt failed for {{ _vhost_name }} (Apache keeps the snakeoil
              certificate). Point DNS at this server, then re-run with
              --tags apache,lets-encrypt. certbot said:
              {{ (le_result.stderr | default('') or le_result.stdout | default('')) | trim | truncate(600) }}
          when:
            - le_result is not skipped
            - le_result.rc | default(0) != 0
          tags: [apache, lets-encrypt]

        - name: Check for a Let's Encrypt certificate
          ansible.builtin.stat:
            path: "/etc/letsencrypt/live/{{ _vhost_name }}/fullchain.pem"
          register: le_cert
          tags: [apache, lets-encrypt]

        # HSTS only with a real certificate. No includeSubDomains/preload: a
        # browser would otherwise upgrade http:// callbacks to subdomains to
        # https://, fail on the certificate name and never reach Apache.
        - name: Default SSL vhost
          ansible.builtin.copy:
            dest: /etc/apache2/sites-available/default-ssl.conf
            mode: "0644"
            content: |
              <IfModule mod_ssl.c>
                <VirtualHost _default_:443>
                  ServerName {{ _vhost_name }}
                  DocumentRoot /var/www/html
                  SSLEngine on
                  SSLCertificateFile {{ le_cert.stat.exists | ternary('/etc/letsencrypt/live/' ~ _vhost_name ~ '/fullchain.pem', '/etc/ssl/certs/ssl-cert-snakeoil.pem') }}
                  SSLCertificateKeyFile {{ le_cert.stat.exists | ternary('/etc/letsencrypt/live/' ~ _vhost_name ~ '/privkey.pem', '/etc/ssl/private/ssl-cert-snakeoil.key') }}
                  <Directory /var/www/html>
                    Require all granted
                    Options -Indexes +FollowSymLinks
                    AllowOverride All
                  </Directory>
              {% if le_cert.stat.exists %}
                  Header always set Strict-Transport-Security "max-age=63072000"
              {% endif %}
                </VirtualHost>
              </IfModule>
          notify: Reload Apache
          tags: [apache, lets-encrypt]

        - name: Enable default-ssl
          ansible.builtin.command: a2ensite default-ssl
          args:
            creates: /etc/apache2/sites-enabled/default-ssl.conf
          notify: Reload Apache
          tags: [apache]

        # Replaces Ubuntu's "Apache2 Default Page", which advertises the OS and
        # web server to anyone who opens the domain.
        - name: Serve the "Under Maintenance" page as index.html
          ansible.builtin.copy:
            src: files/maintenance.html
            dest: /var/www/html/index.html
            owner: root
            group: root
            mode: "0644"
          when: apache_maintenance_page | bool
          tags: [apache]

        # Ubuntu ships "ServerTokens OS" / "ServerSignature On", which put
        # "Apache/2.4.x (Ubuntu)" in every response header and error page.
        - name: Hide the OS and Apache version (Server header, error pages)
          ansible.builtin.lineinfile:
            path: /etc/apache2/conf-available/security.conf
            regexp: "^{{ item.key }}\\s"
            line: "{{ item.key }} {{ item.value }}"
          loop:
            - { key: ServerTokens, value: Prod }
            - { key: ServerSignature, value: "Off" }
          loop_control:
            label: "{{ item.key }} {{ item.value }}"
          notify: Reload Apache
          tags: [apache]

    # ---------- FAIL2BAN (sshd jail on ssh_port) ----------
    - name: Fail2ban
      when: install_fail2ban | bool
      tags: [fail2ban]
      block:
        - name: Install fail2ban
          ansible.builtin.apt:
            state: present
            name:
              - fail2ban
              - python3-systemd  # backend = systemd (no /var/log/auth.log on Debian 12)

        - name: Configure the sshd jail
          ansible.builtin.template:
            src: templates/fail2ban-sshd.local.j2
            dest: /etc/fail2ban/jail.d/sshd.local
            owner: root
            group: root
            mode: "0644"
          notify: Restart fail2ban

        - name: Enable & start fail2ban
          ansible.builtin.systemd:
            name: fail2ban
            enabled: true
            state: started

    # ---------- SHELL PROFILE ----------
    - name: Deploy .bashrc for root
      ansible.builtin.copy:
        src: files/.bashrc
        dest: /root/.bashrc
        owner: root
        group: root
        mode: "0644"
      tags: [shell]

    - name: Deploy .bashrc for {{ primary_user }}
      ansible.builtin.copy:
        src: files/.bashrc
        dest: "/home/{{ primary_user }}/.bashrc"
        owner: "{{ primary_user }}"
        group: "{{ primary_user }}"
        mode: "0644"
      tags: [shell]

    - name: Create ~/.bashrc.d for root and {{ primary_user }}
      ansible.builtin.file:
        path: "{{ item.home }}/.bashrc.d"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
        mode: "0755"
      loop:
        - { home: /root, owner: root }
        - { home: "/home/{{ primary_user }}", owner: "{{ primary_user }}" }
      tags: [shell]

    # ---------- SSHD CONFIG (port ssh_port) ----------
    # Later runs connect as primary_user, so make sure your key opens a
    # session as that user before moving sshd to the new port.
    - name: Check that your key opens a session as {{ primary_user }}
      ansible.builtin.command: >-
        ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new
        {{ ('-i ' ~ _key) if _key | length > 0 else '' }}
        -p {{ _port }} {{ primary_user }}@{{ _target }} true
      vars:
        # delegate_to: localhost makes ansible_host/ansible_port point at
        # localhost, so read the server's values from hostvars instead.
        _target: "{{ hostvars[inventory_hostname]['ansible_host'] | default(inventory_hostname) }}"
        _port: "{{ hostvars[inventory_hostname]['ansible_port'] }}"
        _key: "{{ hostvars[inventory_hostname]['ansible_ssh_private_key_file'] | default('') }}"
      delegate_to: localhost
      become: false
      changed_when: false
      when:
        - ssh_login_check | bool
        - ansible_user == 'root'
      tags: [ssh]

    - name: Ensure the privilege separation dir exists (sshd -t needs it)
      ansible.builtin.file:
        path: /run/sshd
        state: directory
        mode: "0755"
      tags: [ssh]

    - name: Deploy sshd_config
      ansible.builtin.template:
        src: templates/sshd_config.j2
        dest: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: "0644"
        backup: true
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart SSH
      tags: [ssh]

    # Ubuntu >= 22.10 starts sshd from ssh.socket, which listens on whatever
    # port the generator read at boot and ignores later Port changes. A plain
    # ssh.service reads Port straight from sshd_config, same as on Debian.
    # Read-only query that also works when the unit does not exist (Debian).
    - name: Check whether ssh.socket (socket activation) is enabled
      ansible.builtin.command: systemctl is-enabled ssh.socket  # noqa: command-instead-of-module
      register: ssh_socket_state
      changed_when: false
      failed_when: false
      tags: [ssh]

    - name: Switch from ssh.socket to a plain ssh.service
      ansible.builtin.shell: |
        set -e
        systemctl disable --now ssh.socket
        rm -f /etc/systemd/system/ssh.service.d/00-socket.conf
        rm -f /etc/systemd/system/ssh.socket.d/addresses.conf
        systemctl daemon-reload
        systemctl enable ssh.service
      changed_when: true
      when: ssh_socket_state.stdout | trim == 'enabled'
      notify: Restart SSH
      tags: [ssh]

    - name: Apply pending changes now (SSH restart included)
      ansible.builtin.meta: flush_handlers

    # Ubuntu: when the openssh-server upgrade restarts sshd under ssh.socket,
    # that sshd keeps listening on 22 and ssh.service no longer tracks it, so
    # the restart above leaves it running. Stop every sshd listener that is
    # neither on ssh_port nor ssh.service's main process; open sessions are
    # separate processes and stay up.
    - name: Stop leftover sshd listeners on other ports (socket-activation leftovers)
      ansible.builtin.shell: |
        set -euo pipefail
        main=$(systemctl show -p MainPID --value ssh)
        pids=$(ss -Hltnp \
          | awk -v p=":{{ ssh_port }}$" '$4 !~ p' \
          | grep -o '"sshd",pid=[0-9]*' | cut -d= -f2 | sort -u \
          | grep -vx "$main" || true)
        [ -z "$pids" ] && exit 0
        kill $pids
        echo "killed $pids"
      args:
        executable: /bin/bash
      register: stray_sshd
      changed_when: "'killed' in stray_sshd.stdout"
      tags: [ssh]

    - name: Reconnect on ssh_port as {{ primary_user }}
      ansible.builtin.set_fact:
        ansible_port: "{{ ssh_port }}"
        ansible_user: "{{ primary_user }}"
      tags: [ssh]

    - name: Drop the old SSH connection
      ansible.builtin.meta: reset_connection

    - name: Wait until SSH answers on the new port
      ansible.builtin.wait_for_connection:
        timeout: 60
      tags: [ssh]

  handlers:
    - name: Restart SSH
      ansible.builtin.systemd:
        name: ssh
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted

    - name: Reload Apache
      ansible.builtin.systemd:
        name: apache2
        state: reloaded

    - name: Reconfigure wireshark-common
      ansible.builtin.command: dpkg-reconfigure -f noninteractive wireshark-common
      changed_when: true

    - name: Restart fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        state: restarted
