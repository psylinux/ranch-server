---
# Non-sensitive defaults. Personal values (hosts, le_email, ssh_pubkey) live in
# inventory.ini, which is git-ignored -- see inventory.example.ini.

primary_user: cowboy

# The ONE place the SSH port is defined (sshd_config, fail2ban, connection).
ssh_port: 9922

# Before moving sshd to ssh_port, check from your laptop that
# "ssh -p <current port> <primary_user>@host" works, because later runs
# connect as primary_user.
ssh_login_check: true

# ---------- Optional components (also selectable with --tags/--skip-tags) ----------
install_apache: true      # tags: apache, lets-encrypt
install_wireguard: true   # tags: wireguard
install_pyenv: true       # tags: pyenv
install_wireshark: true   # tags: wireshark
install_mingw: true       # tags: mingw
install_fail2ban: true    # tags: fail2ban

# ---------- Apache (tags: apache) ----------
# Serve files/maintenance.html as /var/www/html/index.html instead of Ubuntu's
# default page. Set false to manage index.html yourself (the playbook would
# otherwise overwrite it on every run).
apache_maintenance_page: true

# ---------- Updates (tags: updates) ----------
# Fresh server only (bootstrap connects as root@22): apt dist-upgrade, then
# reboot if the upgrade asks for it. Later runs never upgrade or reboot, so a
# re-run cannot take the site or a C2 session down; unattended-upgrades covers
# security fixes.
first_run_upgrade: true
first_run_reboot: true
# Keep unattended-upgrades (security updates) enabled.
unattended_upgrades: true

# ---------- Docker (tags: docker) ----------
docker_log_max_size: 10m
docker_log_max_file: 3
# true = "docker run -p 8080:80" binds to 127.0.0.1 only; publish on purpose
# with "-p 0.0.0.0:8080:80". Off by default to keep the current behaviour.
docker_publish_localhost_only: false

# ---------- Swap (tags: swap) ----------
# Size of /swapfile in MB; created only when the server has no swap yet.
# Default: 2048 on droplets with less than 2 GB of RAM, otherwise none.
swap_file_size_mb: "{{ 2048 if (ansible_facts.memtotal_mb | default(4096) | int) < 2048 else 0 }}"

# ---------- pyenv ----------
pyenv_version: v2.8.10
pyenv_python_version: "3.14.8"

# ---------- fail2ban (sshd jail) ----------
fail2ban_maxretry: 5
fail2ban_findtime: 10m
fail2ban_bantime: 1h
